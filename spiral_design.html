<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Resolution Spiral Design</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
        }
        
        canvas {
            border-radius: 50%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: radial-gradient(circle, #2a5298, #1e3c72);
        }
        
        .controls {
            margin-top: 20px;
            color: white;
        }
        
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #e55a2b;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="spiralCanvas" width="800" height="800"></canvas>
        <div class="controls">
            <button onclick="downloadCanvas()">Download High-Res Image</button>
            <button onclick="increaseResolution()">Ultra High-Res (2K)</button>
            <button onclick="maxResolution()">Maximum Resolution (4K)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spiralCanvas');
        const ctx = canvas.getContext('2d');
        
        function drawSpiral(resolution = 800) {
            // Set canvas size
            canvas.width = resolution;
            canvas.height = resolution;
            
            const centerX = resolution / 2;
            const centerY = resolution / 2;
            const maxRadius = resolution * 0.4;
            
            // Clear canvas with background gradient
            const bgGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
            bgGradient.addColorStop(0, '#4a90e2');
            bgGradient.addColorStop(1, '#2a5298');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, resolution, resolution);
            
            // Draw multiple spiral layers for depth
            drawSpiralLayer(centerX, centerY, maxRadius, '#ff6b35', '#ff4500', 0, 8, 0.8);
            drawSpiralLayer(centerX, centerY, maxRadius, '#4a90e2', '#1e3c72', Math.PI, 8, 0.7);
            drawSpiralLayer(centerX, centerY, maxRadius, '#ff8c42', '#ff6b35', Math.PI/4, 6, 0.6);
            drawSpiralLayer(centerX, centerY, maxRadius, '#5ba3f5', '#4a90e2', 3*Math.PI/4, 6, 0.5);
            
            // Add center highlight
            const centerGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius * 0.1);
            centerGradient.addColorStop(0, '#87ceeb');
            centerGradient.addColorStop(1, '#4a90e2');
            ctx.fillStyle = centerGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, maxRadius * 0.08, 0, 2 * Math.PI);
            ctx.fill();
            
            // Add subtle outer glow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }
        
        function drawSpiralLayer(centerX, centerY, maxRadius, color1, color2, startAngle, turns, radiusMultiplier) {
            const steps = 1000;
            const angleStep = (turns * 2 * Math.PI) / steps;
            
            for (let i = 0; i < steps; i++) {
                const angle = startAngle + i * angleStep;
                const radius = (i / steps) * maxRadius * radiusMultiplier;
                const nextRadius = ((i + 1) / steps) * maxRadius * radiusMultiplier;
                
                // Create gradient for each segment
                const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, radius);
                gradient.addColorStop(0, color1);
                gradient.addColorStop(1, color2);
                
                // Calculate positions
                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle + angleStep) * nextRadius;
                const y2 = centerY + Math.sin(angle + angleStep) * nextRadius;
                
                // Draw spiral segment with varying width
                const width = (1 - i / steps) * 40 + 5;
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                
                // Add inner shadow effect
                if (i % 10 === 0) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.lineWidth = width * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
        }
        
        function downloadCanvas() {
            const link = document.createElement('a');
            link.download = 'high_res_spiral_design.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function increaseResolution() {
            drawSpiral(2048); // 2K resolution
        }
        
        function maxResolution() {
            drawSpiral(4096); // 4K resolution
        }
        
        // Initial draw
        drawSpiral();
        
        // Add animation option
        let animationId;
        function animateSpiral() {
            let rotation = 0;
            function animate() {
                ctx.save();
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.rotate(rotation);
                ctx.translate(-canvas.width/2, -canvas.height/2);
                drawSpiral(canvas.width);
                ctx.restore();
                rotation += 0.01;
                animationId = requestAnimationFrame(animate);
            }
            animate();
        }
        
        // Add keyboard controls
        document.addEventListener('keydown', function(e) {
            if (e.key === 'a' || e.key === 'A') {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    drawSpiral(canvas.width);
                } else {
                    animateSpiral();
                }
            }
        });
    </script>
</body>
</html>
