<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial gradients for 3D metallic effect -->
    <radialGradient id="redSpiral1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff8888;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ee4444;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cc2222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#881111;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="redSpiral2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" style="stop-color:#ff9999;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#dd3333;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#bb1111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#771111;stop-opacity:1" />
    </radialGradient>
    
    <!-- Linear gradients for depth -->
    <linearGradient id="redDepth1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6666;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc2222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redDepth2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5555;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bb1111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#550000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow and highlight filters -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Main spiral centered -->
  <g transform="translate(256,256)">
    
    <!-- First spiral arm - smooth curve -->
    <path d="M 0,0 
             C -80,-40 -160,-20 -200,60
             C -220,120 -180,180 -120,200
             C -60,220 0,200 40,160
             C 80,120 100,60 80,0
             C 60,-60 20,-80 -20,-60
             C -60,-40 -80,0 -60,40
             C -40,80 0,100 40,80
             C 80,60 100,20 80,-20
             C 60,-60 20,-80 -20,-60
             C -40,-40 -30,-20 -10,-10
             C 10,0 20,20 10,40
             C 0,60 -20,70 -40,60
             C -60,50 -70,30 -60,10
             C -50,-10 -30,-20 -10,-10
             C 10,0 0,0 0,0 Z" 
          fill="url(#redSpiral1)" 
          filter="url(#dropShadow)"
          stroke="#440000" 
          stroke-width="1"/>
    
    <!-- Second spiral arm - interlocking -->
    <path d="M 0,0 
             C 80,40 160,20 200,-60
             C 220,-120 180,-180 120,-200
             C 60,-220 0,-200 -40,-160
             C -80,-120 -100,-60 -80,0
             C -60,60 -20,80 20,60
             C 60,40 80,0 60,-40
             C 40,-80 0,-100 -40,-80
             C -80,-60 -100,-20 -80,20
             C -60,60 -20,80 20,60
             C 40,40 30,20 10,10
             C -10,0 -20,-20 -10,-40
             C 0,-60 20,-70 40,-60
             C 60,-50 70,-30 60,-10
             C 50,10 30,20 10,10
             C -10,0 0,0 0,0 Z" 
          fill="url(#redSpiral2)" 
          filter="url(#dropShadow)"
          stroke="#440000" 
          stroke-width="1"/>
    
    <!-- Third spiral layer for depth -->
    <path d="M 0,0 
             C -60,-30 -120,-15 -150,45
             C -165,90 -135,135 -90,150
             C -45,165 0,150 30,120
             C 60,90 75,45 60,0
             C 45,-45 15,-60 -15,-45
             C -45,-30 -60,0 -45,30
             C -30,60 0,75 30,60
             C 60,45 75,15 60,-15
             C 45,-45 15,-60 -15,-45
             C -30,-30 -22.5,-15 -7.5,-7.5
             C 7.5,0 15,15 7.5,30
             C 0,45 -15,52.5 -30,45
             C -45,37.5 -52.5,22.5 -45,7.5
             C -37.5,-7.5 -22.5,-15 -7.5,-7.5
             C 7.5,0 0,0 0,0 Z" 
          fill="url(#redDepth1)" 
          filter="url(#innerGlow)"
          stroke="#330000" 
          stroke-width="0.5"/>
    
    <!-- Fourth spiral layer -->
    <path d="M 0,0 
             C 60,30 120,15 150,-45
             C 165,-90 135,-135 90,-150
             C 45,-165 0,-150 -30,-120
             C -60,-90 -75,-45 -60,0
             C -45,45 -15,60 15,45
             C 45,30 60,0 45,-30
             C 30,-60 0,-75 -30,-60
             C -60,-45 -75,-15 -60,15
             C -45,45 -15,60 15,45
             C 30,30 22.5,15 7.5,7.5
             C -7.5,0 -15,-15 -7.5,-30
             C 0,-45 15,-52.5 30,-45
             C 45,-37.5 52.5,-22.5 45,-7.5
             C 37.5,7.5 22.5,15 7.5,7.5
             C -7.5,0 0,0 0,0 Z" 
          fill="url(#redDepth2)" 
          filter="url(#innerGlow)"
          stroke="#330000" 
          stroke-width="0.5"/>
    
    <!-- Center core with gradient -->
    <circle cx="0" cy="0" r="15" 
            fill="url(#redSpiral1)" 
            filter="url(#dropShadow)"
            stroke="#220000" 
            stroke-width="1"/>
    
    <!-- Inner center highlight -->
    <circle cx="-3" cy="-3" r="8" 
            fill="#ff9999" 
            opacity="0.8"/>
    
    <!-- Metallic highlights on spiral arms -->
    <ellipse cx="-50" cy="-25" rx="20" ry="8" 
             fill="#ffaaaa" 
             opacity="0.6" 
             transform="rotate(-30)"/>
    <ellipse cx="50" cy="25" rx="20" ry="8" 
             fill="#ffaaaa" 
             opacity="0.6" 
             transform="rotate(150)"/>
    <ellipse cx="25" cy="-50" rx="20" ry="8" 
             fill="#ffaaaa" 
             opacity="0.6" 
             transform="rotate(60)"/>
    <ellipse cx="-25" cy="50" rx="20" ry="8" 
             fill="#ffaaaa" 
             opacity="0.6" 
             transform="rotate(-120)"/>
    
    <!-- Additional depth highlights -->
    <ellipse cx="-80" cy="-40" rx="15" ry="6" 
             fill="#ff7777" 
             opacity="0.4" 
             transform="rotate(-45)"/>
    <ellipse cx="80" cy="40" rx="15" ry="6" 
             fill="#ff7777" 
             opacity="0.4" 
             transform="rotate(135)"/>
  </g>
</svg>