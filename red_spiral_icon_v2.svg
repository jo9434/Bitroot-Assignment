<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main red metallic gradients -->
    <linearGradient id="redMetal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#cc1111;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#881111;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#cc1111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redMetal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6666;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#dd2222;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#991111;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#dd2222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6666;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redMetal3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#bb1111;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#771111;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#bb1111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3333;stop-opacity:1" />
    </linearGradient>
    
    <!-- Highlight gradients for 3D effect -->
    <linearGradient id="highlight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaaaa;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff7777;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="shadow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#660000;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#440000;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#220000;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Filters for 3D effects -->
    <filter id="bevel" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" result="specOut" lighting-color="white" specularConstant="1.5" specularExponent="20">
        <fePointLight x="-50" y="-50" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offset-blur" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Main spiral group -->
  <g transform="translate(256,256)">
    
    <!-- Outer spiral segment 1 -->
    <path d="M 0,0 
             L -15,-120 
             C -50,-180 -120,-190 -180,-150
             C -220,-120 -230,-60 -200,0
             C -180,40 -140,60 -100,50
             C -60,40 -40,10 -35,-20
             C -30,-40 -20,-50 -5,-45
             C 10,-40 15,-25 10,-10
             C 5,-5 0,0 0,0 Z" 
          fill="url(#redMetal1)" 
          filter="url(#bevel)"
          stroke="#330000" 
          stroke-width="0.5"/>
    
    <!-- Outer spiral segment 2 -->
    <path d="M 0,0 
             L 120,-15
             C 180,-50 190,-120 150,-180
             C 120,-220 60,-230 0,-200
             C -40,-180 -60,-140 -50,-100
             C -40,-60 -10,-40 20,-35
             C 40,-30 50,-20 45,-5
             C 40,10 25,15 10,10
             C 5,5 0,0 0,0 Z" 
          fill="url(#redMetal2)" 
          filter="url(#bevel)"
          stroke="#330000" 
          stroke-width="0.5"/>
    
    <!-- Inner spiral segment 1 -->
    <path d="M 0,0 
             L 15,120
             C 50,180 120,190 180,150
             C 220,120 230,60 200,0
             C 180,-40 140,-60 100,-50
             C 60,-40 40,-10 35,20
             C 30,40 20,50 5,45
             C -10,40 -15,25 -10,10
             C -5,5 0,0 0,0 Z" 
          fill="url(#redMetal3)" 
          filter="url(#bevel)"
          stroke="#330000" 
          stroke-width="0.5"/>
    
    <!-- Inner spiral segment 2 -->
    <path d="M 0,0 
             L -120,15
             C -180,50 -190,120 -150,180
             C -120,220 -60,230 0,200
             C 40,180 60,140 50,100
             C 40,60 10,40 -20,35
             C -40,30 -50,20 -45,5
             C -40,-10 -25,-15 -10,-10
             C -5,-5 0,0 0,0 Z" 
          fill="url(#redMetal1)" 
          filter="url(#bevel)"
          stroke="#330000" 
          stroke-width="0.5"/>
    
    <!-- Center connecting pieces -->
    <path d="M 0,0 
             L -8,-60
             C -25,-90 -60,-95 -90,-75
             C -110,-60 -115,-30 -100,0
             C -90,20 -70,30 -50,25
             C -30,20 -20,5 -17.5,-10
             C -15,-20 -10,-25 -2.5,-22.5
             C 5,-20 7.5,-12.5 5,-5
             C 2.5,-2.5 0,0 0,0 Z" 
          fill="url(#redMetal2)" 
          filter="url(#bevel)"
          stroke="#440000" 
          stroke-width="0.3"/>
    
    <path d="M 0,0 
             L 60,-8
             C 90,-25 95,-60 75,-90
             C 60,-110 30,-115 0,-100
             C -20,-90 -30,-70 -25,-50
             C -20,-30 -5,-20 10,-17.5
             C 20,-15 25,-10 22.5,-2.5
             C 20,5 12.5,7.5 5,5
             C 2.5,2.5 0,0 0,0 Z" 
          fill="url(#redMetal3)" 
          filter="url(#bevel)"
          stroke="#440000" 
          stroke-width="0.3"/>
    
    <path d="M 0,0 
             L 8,60
             C 25,90 60,95 90,75
             C 110,60 115,30 100,0
             C 90,-20 70,-30 50,-25
             C 30,-20 20,-5 17.5,10
             C 15,20 10,25 2.5,22.5
             C -5,20 -7.5,12.5 -5,5
             C -2.5,2.5 0,0 0,0 Z" 
          fill="url(#redMetal1)" 
          filter="url(#bevel)"
          stroke="#440000" 
          stroke-width="0.3"/>
    
    <path d="M 0,0 
             L -60,8
             C -90,25 -95,60 -75,90
             C -60,110 -30,115 0,100
             C 20,90 30,70 25,50
             C 20,30 5,20 -10,17.5
             C -20,15 -25,10 -22.5,2.5
             C -20,-5 -12.5,-7.5 -5,-5
             C -2.5,-2.5 0,0 0,0 Z" 
          fill="url(#redMetal2)" 
          filter="url(#bevel)"
          stroke="#440000" 
          stroke-width="0.3"/>
    
    <!-- Center core -->
    <circle cx="0" cy="0" r="12" 
            fill="url(#redMetal3)" 
            filter="url(#bevel)"
            stroke="#220000" 
            stroke-width="0.5"/>
    
    <!-- Highlight effects for 3D look -->
    <ellipse cx="-30" cy="-30" rx="15" ry="8" 
             fill="url(#highlight1)" 
             opacity="0.6" 
             transform="rotate(-45)"/>
    <ellipse cx="30" cy="30" rx="15" ry="8" 
             fill="url(#highlight1)" 
             opacity="0.6" 
             transform="rotate(135)"/>
    <ellipse cx="30" cy="-30" rx="15" ry="8" 
             fill="url(#highlight1)" 
             opacity="0.6" 
             transform="rotate(45)"/>
    <ellipse cx="-30" cy="30" rx="15" ry="8" 
             fill="url(#highlight1)" 
             opacity="0.6" 
             transform="rotate(-135)"/>
    
    <!-- Center highlight -->
    <ellipse cx="-3" cy="-3" rx="6" ry="4" 
             fill="#ffaaaa" 
             opacity="0.7" 
             transform="rotate(-45)"/>
  </g>
</svg>