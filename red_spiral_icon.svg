<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for depth and metallic effect -->
    <radialGradient id="redGradient1" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="redGradient2" cx="0.7" cy="0.7" r="0.8">
      <stop offset="0%" style="stop-color:#ff5252;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="redGradient3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" style="stop-color:#ff8a80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Inner glow filter -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for depth -->
  <circle cx="256" cy="256" r="240" fill="#1a1a1a" opacity="0.8"/>
  
  <!-- Main spiral structure -->
  <g transform="translate(256,256)" filter="url(#shadow)">
    
    <!-- Outer spiral arm 1 -->
    <path d="M 0,0 
             C -120,-80 -200,0 -160,120
             C -120,200 0,180 80,120
             C 160,60 140,-60 60,-100
             C -20,-140 -100,-80 -80,0
             C -60,80 20,100 80,60
             C 140,20 120,-40 80,-60
             C 40,-80 0,-60 0,-20
             C 0,20 20,40 40,20
             C 60,0 40,-20 20,-20
             C 0,-20 -10,-10 0,0 Z" 
          fill="url(#redGradient1)" 
          filter="url(#innerGlow)"
          stroke="#8b0000" 
          stroke-width="1"/>
    
    <!-- Inner spiral arm 2 -->
    <path d="M 0,0 
             C 120,80 200,0 160,-120
             C 120,-200 0,-180 -80,-120
             C -160,-60 -140,60 -60,100
             C 20,140 100,80 80,0
             C 60,-80 -20,-100 -80,-60
             C -140,-20 -120,40 -80,60
             C -40,80 0,60 0,20
             C 0,-20 -20,-40 -40,-20
             C -60,0 -40,20 -20,20
             C 0,20 10,10 0,0 Z" 
          fill="url(#redGradient2)" 
          filter="url(#innerGlow)"
          stroke="#8b0000" 
          stroke-width="1"/>
    
    <!-- Center connecting piece -->
    <path d="M 0,0 
             C -40,-30 -60,0 -50,40
             C -40,60 0,55 30,40
             C 60,25 55,-25 30,-35
             C 5,-45 -25,-30 -25,0
             C -25,30 5,35 25,25
             C 45,15 40,-15 25,-20
             C 10,-25 0,-15 0,-5
             C 0,5 5,10 10,5
             C 15,0 10,-5 5,-5
             C 0,-5 -2,-2 0,0 Z" 
          fill="url(#redGradient3)" 
          filter="url(#innerGlow)"
          stroke="#8b0000" 
          stroke-width="0.5"/>
    
    <!-- Center core -->
    <circle cx="0" cy="0" r="8" fill="url(#redGradient1)" stroke="#8b0000" stroke-width="0.5"/>
    
    <!-- Highlight accents -->
    <path d="M -60,-40 C -40,-60 -20,-50 -30,-30 C -40,-10 -60,-20 -60,-40 Z" 
          fill="#ff8a80" opacity="0.6"/>
    <path d="M 60,40 C 40,60 20,50 30,30 C 40,10 60,20 60,40 Z" 
          fill="#ff8a80" opacity="0.6"/>
    
    <!-- Edge highlights for 3D effect -->
    <path d="M -140,-20 C -120,-40 -100,-30 -110,-10 C -120,10 -140,0 -140,-20 Z" 
          fill="#ff5252" opacity="0.4"/>
    <path d="M 140,20 C 120,40 100,30 110,10 C 120,-10 140,0 140,20 Z" 
          fill="#ff5252" opacity="0.4"/>
  </g>
  
  <!-- Outer glow effect -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.2"/>
</svg>